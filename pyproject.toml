[project]
name = "pyservice-manager"
version = "0.1.0"
description = "Python Service Management Platform with module system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "watchdog>=4.0",
    "tomli_w>=1.0",
    "python-multipart>=0.0.9",
    "greenlet>=3.0",
    "pymysql>=1.1",
    "certifi",
    "packaging>=23.0",
]

[project.scripts]
pyservice = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]
