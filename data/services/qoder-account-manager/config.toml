# Qoder 账号管理服务配置

[qoder]
# Qoder 国际版配置（appId=57 对应）
api_base_url = "https://api.qoder.com"
api_key = ""
organization_id = ""

[qoder_cn]
# Qoder CN 配置（appId=56 对应），独立组织实例
api_base_url = "https://api.qoder.cn"
api_key = ""
organization_id = ""

[schedule]
# cron 表达式（5 段式：分 时 日 月 周），优先使用；每天 9:00 执行
cron = "0 9 * * *"
# 备用：若 croniter 未安装，使用固定时刻（24h），默认 9
run_hour = 9

[monitor]
rate_limit_delay = 0.5
# 同一成员告警去重天数，N 天内只告警一次，默认 1
alarm_dedup_days = 1
# 前端自动刷新间隔（秒），默认 60
refresh_interval = 60
# 账号自动清理阈值：距下次重置不足 24h 且总计已用 ≤ 此值时自动删除
auto_cleanup_threshold = 50

[alert]
from = "Qoder账号管理"
name = "Qoder账号管理"

[heartbeat]
interval_minutes = 10

[accounts]
app_id_cn = 56
app_id_global = 57
excel_qoder = "/Users/paulyao/Downloads/Qoder 账号管理 (2).xlsx"
excel_qoder_cn = "/Users/paulyao/Downloads/Qoder cn账号管理.xlsx"

[ai_code]
# 统计最近 N 天的 AI 代码数据，默认 30
days = 30
