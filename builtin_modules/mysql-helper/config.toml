# MySQL Helper module configuration
# This module uses a connection pool to reuse connections.

[defaults]
# Default connection parameters (used as reference, not auto-applied)
host = "127.0.0.1"
port = 3306
charset = "utf8mb4"
connect_timeout = 10

[pool]
max_idle_connections = 5    # 每个参数组合最大空闲连接数
idle_timeout = 300          # 空闲连接超时时间（秒）
