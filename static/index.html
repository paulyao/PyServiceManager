<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyService 服务管理平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="importmap">
    {
        "imports": {
            "codemirror": "https://esm.sh/codemirror@6.0.1",
            "@codemirror/view": "https://esm.sh/@codemirror/view@6",
            "@codemirror/state": "https://esm.sh/@codemirror/state@6",
            "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6.2.1",
            "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.3",
            "@codemirror/language": "https://esm.sh/@codemirror/language@6",
            "@lezer/highlight": "https://esm.sh/@lezer/highlight@1",
            "@codemovie/lezer-toml": "https://esm.sh/@codemovie/lezer-toml@1.1.1"
        }
    }
    </script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span>⚙️</span>
                <span style="background:linear-gradient(135deg,var(--primary),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PyService</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" data-route="services" onclick="navigate('services')">
                    <span class="icon">🔧</span>
                    <span class="nav-text">服务管理</span>
                </a>
                <a class="nav-item" data-route="modules" onclick="navigate('modules')">
                    <span class="icon">📦</span>
                    <span class="nav-text">模块管理</span>
                </a>
                <a class="nav-item" data-route="backup" onclick="navigate('backup')">
                    <span class="icon">💾</span>
                    <span class="nav-text">备份恢复</span>
                </a>
            </nav>
        </aside>
        <main class="main-content" id="main-content">
            <div class="empty-state">
                <div class="icon">⚙️</div>
                <div class="title">加载中...</div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"></div>

    <script>
        // CodeMirror 模块异步加载 Promise
        window.CMReady = new Promise(resolve => { window.CMReadyResolve = resolve; });
    </script>
    <script type="module">
        import '/static/js/editor.js';
    </script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/services.js"></script>
    <script src="/static/js/modules.js"></script>
    <script src="/static/js/backup.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
