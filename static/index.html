<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyService 服务管理平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span>⚙️</span>
                <span>PyService</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" data-route="services" onclick="navigate('services')">
                    <span class="icon">🔧</span>
                    <span class="nav-text">服务管理</span>
                </a>
                <a class="nav-item" data-route="modules" onclick="navigate('modules')">
                    <span class="icon">📦</span>
                    <span class="nav-text">模块管理</span>
                </a>
            </nav>
        </aside>
        <main class="main-content" id="main-content">
            <div class="empty-state">
                <div class="icon">⚙️</div>
                <div class="title">加载中...</div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/services.js"></script>
    <script src="/static/js/modules.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
